name: ci

on:
  push:
  pull_request:

jobs:
  # Proves `git clone && pytest` works with nothing else on disk -- the first thing
  # anyone tries. The graphrx hand-off tests importorskip out here, by design.
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest -q

  # The hand-off is the one part the job above cannot cover, so it gets its own job
  # with the sibling actually checked out. Without this, those tests would skip on
  # every run and CI would stay green while the integration rotted -- the exact
  # failure mode that let a lint error hide three unrun eval suites in a sibling
  # project for a month. Bump the pin deliberately.
  graphrx-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: linkgraph
      - name: Check out rag-reliability (supplies graphrx)
        uses: actions/checkout@v4
        with:
          repository: trentmilam/rag-reliability
          ref: caebd6a0869193775ebb832ced2c254983086a09
          path: rag-reliability
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest numpy
      - name: Run the hand-off tests, and fail if they were skipped
        working-directory: linkgraph
        run: |
          pytest -q tests/test_graphrx_handoff.py -rs | tee out.txt
          grep -q "skipped" out.txt && { echo "graphrx was not importable -- the sibling checkout did not work"; exit 1; }
          exit 0
