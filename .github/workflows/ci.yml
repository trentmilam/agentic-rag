name: ci

on:
  push:
  pull_request:

jobs:
  # Deliberately a BARE checkout with no sibling repos on disk. activerag reads a
  # Consilium answer's citation/dropped-claim/margin signals, so a few tests need
  # the sibling repos and importorskip out here -- `-rs` prints exactly which and
  # why, so a skip is visible in the log instead of hiding behind a green tick.
  # What this job proves is the thing a reviewer actually does first:
  # `git clone && pytest` works on its own.
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q -rs
