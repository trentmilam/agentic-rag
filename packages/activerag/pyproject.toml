[project]
name = "activerag"
version = "0.1.0"
description = "Consilium-aware evidence-sufficiency triggers for a self-extending RAG hunt-and-retry loop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Trent Milam" }]
# numpy is required transitively by activerag.headroom_gate: it reuses the
# sibling `headroom` flat module (rag-reliability/headroom), which imports numpy.
# That sibling is imported by sys.path (not pip-installed), so its own deps are
# not pulled in automatically -- activerag's env must provide them.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["activerag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
