[project]
name = "RAGpack"
version = "0.2.0"
description = "Mill documents into a searchable vector store: GPU-optional embeddings + optional GPU OCR, Qdrant-backed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Trent Milam" }]
keywords = ["rag", "retrieval", "embeddings", "qdrant", "fastembed", "vector-search", "ocr", "gpu", "cuda"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "fastembed>=0.3",
    "qdrant-client>=1.9",
    "pypdf>=4.0",
]

[project.optional-dependencies]
gpu = ["fastembed-gpu>=0.3", "onnxruntime-gpu>=1.17"]   # CUDA embeddings
ocr = ["python-doctr[torch]>=0.8"]                       # GPU OCR for scanned PDFs
dev = ["pytest>=8"]

[project.scripts]
ragpack = "ragpack.cli:main"

[project.urls]
Homepage = "https://github.com/trentmilam/agentic-rag/tree/main/packages/ragpack"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
